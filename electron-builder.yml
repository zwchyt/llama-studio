appId: com.llama-studio.app
productName: llama-studio
directories:
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
nodeGypRebuild: false
extraResources:
  - from: resources
    to: resources
  - from: assets/llama-studio-icon.png
    to: assets/llama-studio-icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: assets/llama-studio-icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: assets/llama-studio-icon-1024.png
linux:
  target: AppImage
  icon: assets/llama-studio-icon.png
